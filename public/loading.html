<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <style>
    /* Full-screen loader container */
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    /* Loader animation */
    .loader {
      display: flex;
      gap: 15px;
    }

    .loader div {
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }

    .loader div:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader div:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      to {
        transform: translateY(-20px);
        background: #ffeb3b;
      }
    }

    /* Optional: fade in text under loader */
    .loading-text {
      color: #fff;
      margin-top: 40px;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="loader">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="loading-text">Loading awesome things...</div>
  </div>
</body>
<script>
    setTimeout(() => {
        window.location.href = '/'; // Change to your target page
    }, 3000); 
</script>
</html>
